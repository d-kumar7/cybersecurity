name: Build Standalone Binaries

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Workspace (Release Mode)
        working-directory: ./Rust_Tools
        run: cargo build --release

      - name: Upload Linux and macOS Binaries
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cybersecurity-tools-${{ matrix.os }}
          path: |
            Rust_Tools/target/release/recon
            Rust_Tools/target/release/scan
            Rust_Tools/target/release/auditor
            Rust_Tools/target/release/forensics

      - name: Upload Windows Binaries
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cybersecurity-tools-${{ matrix.os }}
          path: |
            Rust_Tools/target/release/recon.exe
            Rust_Tools/target/release/scan.exe
            Rust_Tools/target/release/auditor.exe
            Rust_Tools/target/release/forensics.exe
